name: 🚀 Build Flutter Web & Deploy to Render

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Build Flutter Web (runs on GitHub's free Ubuntu runners)
  # ============================================================================
  build-flutter-web:
    name: 🏗️ Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter 3.41.6 (cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      - name: 🔨 Build Flutter Web (production release)
        run: flutter build web --release --no-wasm-dry-run

      - name: 📂 Copy build output → backend/public (single location)
        run: |
          rm -rf backend/public
          cp -r build/web backend/public
          echo "✅ Flutter web copied to backend/public"
          echo "📦 Size: $(du -sh backend/public | cut -f1)"

      - name: 💾 Upload backend/public as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: backend/public
          retention-days: 7

  # ============================================================================
  # JOB 2: Commit backend/public back to repo → Render auto-deploys slim Docker
  # ============================================================================
  deploy-to-render:
    name: 🟣 Commit Web Build & Trigger Render Deploy
    needs: build-flutter-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📥 Download Flutter web build artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: backend/public

      - name: 📝 Commit backend/public to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add backend/public (overrides .gitignore exceptions)
          git add -f backend/public

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "✅ No changes in Flutter web build — skipping commit."
          else
            git commit -m "ci: update Flutter web build [skip ci]"
            git push
            echo "✅ Flutter web build committed to backend/public"
          fi

      - name: 📡 Trigger Render Deploy Hook
        if: ${{ env.RENDER_HOOK != '' }}
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render deploy..."
          curl -s -f -X POST "$RENDER_HOOK"
          echo "✅ Render deployment triggered!"

      - name: ℹ️ Render Auto-Deploy Notice
        if: ${{ env.RENDER_HOOK == '' }}
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "ℹ️  Render will auto-deploy because this repo is connected via render.yaml."
          echo "👉 To also trigger via webhook, add RENDER_DEPLOY_HOOK_URL to GitHub Secrets."

  # ============================================================================
  # JOB 3: Deploy Flutter Web to Vercel (optional - only runs if secret is set)
  # ============================================================================
  deploy-vercel:
    name: ▲ Deploy to Vercel (Edge CDN)
    needs: build-flutter-web
    runs-on: ubuntu-latest
    if: always() && needs.build-flutter-web.result == 'success'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Flutter web build artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: backend/public

      - name: 🚀 Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --prod --token "$VERCEL_TOKEN" --yes --cwd backend/public
          echo "✅ Vercel deployment completed!"

      - name: ℹ️ Vercel Notice
        if: ${{ env.VERCEL_TOKEN == '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "ℹ️ Vercel skipped: add VERCEL_TOKEN to GitHub Secrets to enable."

  # ============================================================================
  # JOB 4: Deploy to DigitalOcean (optional - only runs if secrets are set)
  # ============================================================================
  deploy-digitalocean:
    name: 🌊 Deploy to DigitalOcean
    needs: build-flutter-web
    runs-on: ubuntu-latest
    if: always() && needs.build-flutter-web.result == 'success'
    steps:
      - name: 🌊 Trigger DigitalOcean App Platform Deploy
        if: ${{ env.DO_TOKEN != '' && env.DO_APP_ID != '' }}
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
        run: |
          curl -s -f -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments"
          echo "✅ DigitalOcean deployment initiated!"

      - name: ℹ️ DigitalOcean Notice
        if: ${{ env.DO_TOKEN == '' || env.DO_APP_ID == '' }}
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
        run: echo "ℹ️ DigitalOcean skipped: add DIGITALOCEAN_ACCESS_TOKEN and DIGITALOCEAN_APP_ID to GitHub Secrets."
